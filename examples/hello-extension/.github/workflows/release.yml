# Publishes the extension where den installs it from: a tag `v<version>`
# makes a GitHub release with `<id>-windows-x86_64.zip` and
# `<id>-macos-aarch64.zip` (extension.json + the library, README.md and the
# icon when there are) and `extension.json` with each zip's sha256, which den
# reads first.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $manifest = Get-Content extension.json -Raw | ConvertFrom-Json
          if ("v$($manifest.version)" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $($manifest.version) in extension.json" }
          $id = $manifest.id
          $name = $id -replace '-', '_'
          $lib = if ($IsWindows) { "target/release/$name.dll" } else { "target/release/lib$name.dylib" }
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item extension.json, $lib dist/pkg/
          # den shows these in its Extensions view and on the extension's page.
          if (Test-Path README.md) { Copy-Item README.md dist/pkg/ }
          if ($manifest.icon) {
            $icon = Join-Path dist/pkg $manifest.icon
            New-Item -ItemType Directory -Force (Split-Path $icon) | Out-Null
            Copy-Item $manifest.icon $icon
          }
          $zip = "dist/$id-${{ matrix.platform }}.zip"
          if ($IsWindows) {
            Compress-Archive -Path dist/pkg/* -DestinationPath $zip
          } else {
            # ditto keeps the library's executable bit (Compress-Archive would not) and, without
            # resource forks, adds no __MACOSX entries.
            ditto -c -k --norsrc dist/pkg $zip
          }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding utf8NoBOM "dist/sha256-${{ matrix.platform }}.txt" $sha
          Remove-Item -Recurse dist/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        shell: pwsh
        run: |
          $manifest = Get-Content extension.json -Raw | ConvertFrom-Json
          # The Windows zip's hash is `sha256` (the first platform); the others go under `platforms`.
          $manifest | Add-Member -NotePropertyName sha256 -NotePropertyValue (Get-Content dist/sha256-windows-x86_64.txt -Raw).Trim() -Force
          $platforms = @{}
          foreach ($file in Get-ChildItem dist/sha256-*.txt) {
            $platform = $file.BaseName -replace '^sha256-', ''
            if ($platform -ne 'windows-x86_64') { $platforms[$platform] = (Get-Content $file -Raw).Trim() }
          }
          $manifest | Add-Member -NotePropertyName platforms -NotePropertyValue $platforms -Force
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM dist/extension.json
          Remove-Item dist/sha256-*.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/extension.json --title "${{ github.ref_name }}" --generate-notes
