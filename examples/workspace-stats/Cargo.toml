[package]
name = "workspace-stats"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Outside den's repository: den-extension = { git = "https://github.com/patrickiel/den" }
den-extension = { path = "../../crates/den-extension" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
