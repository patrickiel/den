# The Mac build of a release. scripts/release.ts makes a release from Windows;
# when it is published this builds den.app on an Apple Silicon runner, signs
# the archive with the updater key and adds both to that release
# (`node scripts/release.ts --attach`, the same as on a Mac of your own).
#
# Secrets: DEN_SIGNING_KEY holds the private key file (~/.keys/den.key, the
# one packaging/updater.pub belongs to), DEN_SIGNING_KEY_PASSWORD its
# password if it has one. Set them with
#   gh secret set DEN_SIGNING_KEY < ~/.keys/den.key
# A failed run can be repeated, or run for an older release, from the Actions
# tab (Run workflow, with the tag).
name: mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # The script checks that HEAD is the tag's commit.
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Signing key
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/den.key"
          echo "DEN_SIGNING_KEY=$RUNNER_TEMP/den.key" >> "$GITHUB_ENV"
        env:
          KEY: ${{ secrets.DEN_SIGNING_KEY }}
      - name: Build, sign and attach
        run: node scripts/release.ts --attach
        env:
          GH_TOKEN: ${{ github.token }}
          DEN_SIGNING_KEY_PASSWORD: ${{ secrets.DEN_SIGNING_KEY_PASSWORD }}
