# Builds a release for both platforms. scripts/release.ts bumps the version,
# tags it, makes a draft release with the notes and starts this with the tag;
# it builds and signs the Windows installer and the Mac app archive (plus a
# disk image of the app for downloads), adds them and the updater manifest
# (latest.json) to the release, and publishes it. Until then the previous release stays the latest, so updates never see
# a half-built one.
#
# Started from main (not by the tag) on purpose: GitHub only shares caches
# within a ref or from the default branch, so this way each run reuses the
# compiled dependencies of the last one and builds den's crates only.
#
# Secrets: DEN_SIGNING_KEY holds the updater's private key file (the one
# packaging/updater.pub belongs to), DEN_SIGNING_KEY_PASSWORD its password if
# it has one. Set them with
#   gh secret set DEN_SIGNING_KEY < ~/.keys/den.key
# A failed run can be repeated from the Actions tab (Run workflow, with the tag).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v1.2.3)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The compiled dependencies are worth keeping even when packaging fails.
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($IsWindows) {
            $asset = "den_${version}_x64-setup.exe"
            # The runner image has NSIS, but not on PATH.
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
            # NSIS wants backslashes in its File paths.
            $root = $PWD.Path
            & $makensis -V2 "-DVERSION=$version" "-DEXE=$root\target\release\den.exe" "-DOUTFILE=$root\dist\$asset" packaging\installer.nsi
          } else {
            $asset = "den_${version}_aarch64.app.tar.gz"
            sh scripts/bundle-macos.sh $version
            tar -czf "dist/$asset" -C target/release den.app
            # The archive is for the updater; people get a disk image: open it,
            # drag den onto the Applications link.
            mkdir -p dist/dmg
            cp -R target/release/den.app dist/dmg/
            ln -s /Applications dist/dmg/Applications
            hdiutil create -volname den -srcfolder dist/dmg -ov -format UDZO "dist/den_${version}_aarch64.dmg"
            rm -rf dist/dmg
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The updater checks this signature against packaging/updater.pub.
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/den.key", $env:KEY)
          pnpm dlx @tauri-apps/cli@2 signer sign -f "$env:RUNNER_TEMP/den.key" "--password=$env:PASSWORD" "dist/$asset"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        env:
          KEY: ${{ secrets.DEN_SIGNING_KEY }}
          PASSWORD: ${{ secrets.DEN_SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        shell: pwsh
        run: |
          # latest.json in Tauri's format; src/update.rs reads its entry for the platform.
          $version = "$env:TAG".TrimStart("v")
          $notes = gh release view $env:TAG --repo $env:REPO --json body -q .body
          $platforms = [ordered]@{}
          foreach ($sig in Get-ChildItem dist/*.sig) {
            $asset = $sig.BaseName
            $platform = if ($asset -like "*setup.exe") { "windows-x86_64" } else { "darwin-aarch64" }
            $platforms[$platform] = [ordered]@{
              signature = (Get-Content $sig -Raw).Trim()
              url = "https://github.com/$env:REPO/releases/download/$env:TAG/$asset"
            }
          }
          Remove-Item dist/*.sig
          $manifest = [ordered]@{ version = $version; notes = $notes; pub_date = (Get-Date).ToUniversalTime().ToString("o"); platforms = $platforms }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
        env:
          REPO: ${{ github.repository }}
      - name: Publish
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
