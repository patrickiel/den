[package]
name = "den-core"
version = "0.1.0"
edition = "2024"
description = "The work den does on a folder, without a window: git, search, watching the disk, shells. Shared by den and den-server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
futures = "0.3"
regex = "1"
ignore = "0.4"
globset = "0.4"
notify = "8"
trash = "5"

[target.'cfg(unix)'.dependencies]
# The host follows what its terminals show, to set a returning den right.
alacritty_terminal = "0.26.0"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
