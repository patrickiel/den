[workspace]
members = [".", "crates/den-extension", "examples/hello-extension"]

[package]
name = "den"
version = "0.31.0"
edition = "2024"
description = "A project terminal for Windows, macOS and Linux: split panes, editor, explorer, search and source control"

[dependencies]
anyhow = "1"
gpui-kit = "0.7.0"
# Same crate gpui-kit re-exports; named directly only to pick the editor grammars.
gpui-component = { version = "0.7.0", features = [
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-markdown",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-python",
    "tree-sitter-bash",
    "tree-sitter-svelte",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
futures = "0.3"
regex = "1"
ignore = "0.4"
globset = "0.4"
notify = "8"
trash = "5"
similar = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
smallvec = "1"
encoding_rs = "0.8"
minisign-verify = "0.2"
libloading = "0.8"
# PDF tabs: PDFium, bound at run time to the library den downloads (`pdf.rs`).
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
# The version gpui builds; its frames carry a PDF's drawn pages.
image = { version = "0.25", default-features = false }
den-extension = { path = "crates/den-extension" }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# The version gpui builds; for a monitor's scale under a point (floating windows).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    # The updater closes the other dens before the installer runs.
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

# gpui is unbearably slow unoptimised; keep this crate debuggable, optimise deps.
[profile.dev.package."*"]
opt-level = 2
